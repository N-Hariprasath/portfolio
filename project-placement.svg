<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Card Background Glow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top Ambient Glow -->
  <circle cx="200" cy="80" r="160" fill="#6366f1" opacity="0.15" filter="blur(40px)" />
  <circle cx="650" cy="180" r="140" fill="#06b6d4" opacity="0.12" filter="blur(40px)" />

  <!-- Main Window Container -->
  <g transform="translate(40, 30)" filter="url(#cardShadow)">
    <!-- Window Frame -->
    <rect width="720" height="390" rx="16" fill="#131b2e" stroke="rgba(255,255,255,0.1)" stroke-width="1.2" />

    <!-- Window Header -->
    <rect width="720" height="42" rx="16" fill="#0f172a" />
    <rect y="26" width="720" height="16" fill="#0f172a" />
    <line x1="0" y1="42" x2="720" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />

    <!-- Window Title -->
    <text x="360" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      Placement Preparation Portal • Python Flask &amp; MySQL
    </text>

    <!-- App Header inside UI -->
    <g transform="translate(24, 60)">
      <rect width="28" height="28" rx="8" fill="url(#primaryAccent)" />
      <path d="M10 9 L18 14 L10 19 Z" fill="#ffffff" transform="translate(2, 0)" />
      <text x="38" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">PlacementPrep Portal</text>
      <rect x="530" y="2" width="140" height="26" rx="13" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8" />
      <circle cx="542" cy="15" r="3.5" fill="#10b981" />
      <text x="554" y="18" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Placement Ready: 95%</text>
    </g>

    <!-- Left Sub-card: React TypeScript Code Editor -->
    <g transform="translate(24, 105)">
      <rect width="410" height="260" rx="12" fill="#0b0f19" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <!-- Editor Header -->
      <rect width="410" height="34" rx="12" fill="#111827" />
      <rect y="20" width="410" height="14" fill="#111827" />
      <text x="16" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PlacementPortal.tsx</text>
      <rect x="330" y="6" width="66" height="22" rx="6" fill="#3b82f6" />
      <text x="363" y="21" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">BUILD</text>

      <!-- Code Snippet -->
      <g transform="translate(16, 54)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">
        <text y="0" fill="#64748b">1</text>
        <text x="24" y="0" fill="#c084fc">import</text>
        <text x="74" y="0" fill="#38bdf8">React, { useState }</text>
        <text x="235" y="0" fill="#c084fc">from</text>
        <text x="275" y="0" fill="#34d399">'react'</text>

        <text y="22" fill="#64748b">2</text>
        <text x="24" y="22" fill="#c084fc">import</text>
        <text x="74" y="22" fill="#e2e8f0">{ AssessmentTrack }</text>
        <text x="230" y="22" fill="#c084fc">from</text>
        <text x="270" y="22" fill="#34d399">'./types'</text>

        <text y="44" fill="#64748b">3</text>
        <text x="24" y="44" fill="#c084fc">export const</text>
        <text x="120" y="44" fill="#60a5fa">PortalApp: React.FC</text>
        <text x="270" y="44" fill="#94a3b8">= () => {</text>

        <text y="66" fill="#64748b">4</text>
        <text x="44" y="66" fill="#c084fc">const</text>
        <text x="88" y="66" fill="#e2e8f0">[score] = useState&lt;number&gt;(</text>
        <text x="272" y="66" fill="#f59e0b">95</text>
        <text x="288" y="66" fill="#e2e8f0">)</text>

        <text y="88" fill="#64748b">5</text>
        <text x="44" y="88" fill="#c084fc">return</text>
        <text x="94" y="88" fill="#94a3b8">(</text>

        <text y="110" fill="#64748b">6</text>
        <text x="64" y="110" fill="#38bdf8">&lt;div</text>
        <text x="100" y="110" fill="#facc15">className</text>
        <text x="168" y="110" fill="#94a3b8">=</text>
        <text x="176" y="110" fill="#34d399">"grid grid-cols-2 gap-4 p-6"</text>
        <text x="368" y="110" fill="#38bdf8">&gt;</text>

        <text y="132" fill="#64748b">7</text>
        <text x="84" y="132" fill="#38bdf8">&lt;AssessmentTrack</text>
        <text x="210" y="132" fill="#facc15">readiness</text>
        <text x="276" y="132" fill="#94a3b8">=</text>
        <text x="284" y="132" fill="#e2e8f0">{score}</text>
        <text x="336" y="132" fill="#38bdf8">/&gt;</text>
      </g>

      <!-- Terminal Output Bar -->
      <g transform="translate(16, 222)">
        <rect width="378" height="26" rx="6" fill="#1e293b" />
        <circle cx="12" cy="13" r="3.5" fill="#10b981" />
        <text x="24" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">✓ Vite v5.x ready in 214ms (React + TS)</text>
      </g>
    </g>

    <!-- Right Sub-card: Performance & Assessments -->
    <g transform="translate(450, 105)">
      <rect width="246" height="260" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <!-- Right Card Title -->
      <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Tech Stack &amp; Modules</text>

      <!-- Readiness Circle Gauge -->
      <g transform="translate(123, 85)">
        <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="7" />
        <circle cx="0" cy="0" r="42" fill="none" stroke="url(#primaryAccent)" stroke-width="7" stroke-dasharray="264" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90)" />
        <text x="0" y="6" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">95%</text>
        <text x="0" y="20" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="600" text-anchor="middle">READINESS</text>
      </g>

      <!-- Metric Bars -->
      <g transform="translate(16, 150)">
        <!-- Metric 1: React & TypeScript -->
        <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">React + TypeScript (Vite)</text>
        <text x="214" y="10" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">98%</text>
        <rect y="16" width="214" height="6" rx="3" fill="#334155" />
        <rect y="16" width="209" height="6" rx="3" fill="url(#cyanAccent)" />

        <!-- Metric 2: Tailwind CSS -->
        <text x="0" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Tailwind CSS Responsive UI</text>
        <text x="214" y="38" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">94%</text>
        <rect y="44" width="214" height="6" rx="3" fill="#334155" />
        <rect y="44" width="201" height="6" rx="3" fill="url(#primaryAccent)" />

        <!-- Metric 3: Assessment Modules -->
        <text x="0" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Aptitude &amp; Coding Tracks</text>
        <text x="214" y="66" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">92%</text>
        <rect y="72" width="214" height="6" rx="3" fill="#334155" />
        <rect y="72" width="197" height="6" rx="3" fill="url(#emeraldAccent)" />
      </g>

      <!-- Target Tags -->
      <g transform="translate(16, 240)">
        <rect x="0" y="-8" width="55" height="18" rx="4" fill="#0f172a" />
        <text x="27" y="5" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">React</text>

        <rect x="62" y="-8" width="75" height="18" rx="4" fill="#0f172a" />
        <text x="99" y="5" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript</text>

        <rect x="144" y="-8" width="70" height="18" rx="4" fill="#0f172a" />
        <text x="179" y="5" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Tailwind</text>
      </g>
    </g>
  </g>
</svg>
